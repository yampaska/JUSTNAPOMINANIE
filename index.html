<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07040f">
<title>Для тебя ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07040f;
    --card: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.12);
    --text: #f4ecff;
    --muted: #b9a9d6;
    --pink: #ff7eb6;
    --violet: #b79bff;
    --sky: #7fdbff;
    --error: #ff8fa8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Comfortaa', system-ui, -apple-system, 'Segoe UI', sans-serif;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  .screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.9s ease, visibility 0.9s ease;
  }
  .screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  /* ---------- Экран с замком ---------- */
  #lockScreen {
    padding: 16px;
    background:
      radial-gradient(60vmax 60vmax at 15% 20%, rgba(183, 155, 255, 0.18), transparent 60%),
      radial-gradient(55vmax 55vmax at 85% 80%, rgba(255, 126, 182, 0.16), transparent 60%),
      radial-gradient(40vmax 40vmax at 70% 15%, rgba(127, 219, 255, 0.10), transparent 60%),
      var(--bg);
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.45;
    animation: float 12s ease-in-out infinite;
    pointer-events: none;
  }
  .blob.b1 { width: 220px; height: 220px; background: #b79bff; top: 8%; left: -40px; }
  .blob.b2 { width: 260px; height: 260px; background: #ff7eb6; bottom: 5%; right: -60px; animation-delay: -4s; }
  .blob.b3 { width: 160px; height: 160px; background: #7fdbff; top: 55%; left: 20%; animation-delay: -8s; opacity: 0.25; }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(20px, -30px) scale(1.08); }
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 380px;
    padding: 36px 24px 28px;
    border-radius: 28px;
    background: var(--card);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    text-align: center;
    transition: transform 0.8s cubic-bezier(.2,.8,.2,1), box-shadow 0.8s ease;
  }
  .card.shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97); }
  .card.success { box-shadow: 0 0 80px rgba(255, 126, 182, 0.45), 0 20px 60px rgba(0, 0, 0, 0.5); transform: scale(1.03); }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-8px); }
    40%, 60% { transform: translateX(8px); }
  }

  .lock {
    width: 110px;
    height: 130px;
    margin: 0 auto 18px;
    filter: drop-shadow(0 0 14px rgba(255, 126, 182, 0.55)) drop-shadow(0 0 30px rgba(183, 155, 255, 0.35));
    animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .lock .shackle {
    transform-origin: 72px 52px;
    transition: transform 0.7s cubic-bezier(.3,1.6,.5,1);
  }
  .lock.open .shackle { transform: translateY(-16px) rotate(-22deg); }
  .lock .keyhole { transition: fill 0.4s ease; }
  .lock.open .keyhole { fill: #9effd8; }

  .hint {
    font-size: 15px;
    line-height: 1.5;
    color: var(--muted);
    margin-bottom: 22px;
  }

  .input-wrap {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #dateInput {
    width: 100%;
    padding: 15px 18px;
    font-family: inherit;
    font-size: 20px; /* ≥16px — без зума на iOS */
    font-weight: 600;
    letter-spacing: 3px;
    text-align: center;
    color: var(--text);
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 16px;
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s;
    -webkit-user-select: text;
    user-select: text;
  }
  #dateInput::placeholder { color: rgba(244, 236, 255, 0.28); letter-spacing: 2px; }
  #dateInput:focus {
    border-color: rgba(255, 126, 182, 0.6);
    box-shadow: 0 0 0 4px rgba(255, 126, 182, 0.15), 0 0 24px rgba(255, 126, 182, 0.2);
  }

  #unlockBtn {
    padding: 15px 18px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    color: #1a0b1f;
    background: linear-gradient(135deg, #ff9ec7, #c3a6ff 55%, #9fe3ff);
    border: none;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255, 126, 182, 0.3);
    transition: transform 0.15s ease, box-shadow 0.25s ease;
  }
  #unlockBtn:hover { box-shadow: 0 10px 32px rgba(255, 126, 182, 0.45); }
  #unlockBtn:active { transform: scale(0.97); }

  .error {
    min-height: 22px;
    margin-top: 14px;
    font-size: 14px;
    color: var(--error);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .error.show { opacity: 1; }

  /* ---------- Экран с частицами ---------- */
  #scene { background: #000; cursor: pointer; touch-action: none; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .tap-hint {
    position: absolute;
    left: 50%;
    bottom: max(48px, calc(env(safe-area-inset-bottom) + 32px));
    transform: translateX(-50%);
    font-size: clamp(15px, 4.2vw, 20px);
    letter-spacing: 2px;
    color: #f4ecff;
    text-shadow: 0 0 10px rgba(255, 126, 182, 0.9), 0 0 24px rgba(183, 155, 255, 0.7);
    white-space: nowrap;
    animation: pulse 2s ease-in-out infinite;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  .tap-hint.gone { opacity: 0 !important; animation: none; }
  @keyframes pulse {
    0%, 100% { opacity: 0.45; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.06); }
  }

  .message {
    position: absolute;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    opacity: 0;
    filter: blur(8px);
    transition: opacity 1.6s ease, filter 1.6s ease;
  }
  .message.show { opacity: 1; filter: blur(0); }
  .message .main {
    font-weight: 700;
    line-height: 1.2;
    color: #fff;
    text-shadow:
      0 0 6px rgba(0, 0, 0, 0.9),
      0 0 12px rgba(255, 110, 170, 0.95),
      0 0 28px rgba(255, 110, 170, 0.7);
    margin-bottom: 0.6em;
  }
  .message .sub {
    font-weight: 600;
    line-height: 1.45;
    color: #ffe9f3;
    text-shadow:
      0 0 4px rgba(0, 0, 0, 1),
      0 0 8px rgba(0, 0, 0, 0.9),
      0 0 16px rgba(183, 155, 255, 0.7);
    opacity: 0;
    transition: opacity 1.6s ease 0.9s;
  }
  .message.show .sub { opacity: 1; }
</style>
</head>
<body>

<!-- ===== 1. Замок ===== -->
<section id="lockScreen" class="screen">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="card" id="card">
    <svg class="lock" id="lock" viewBox="0 0 110 130" aria-hidden="true">
      <defs>
        <linearGradient id="lockGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff9ec7"/>
          <stop offset="55%" stop-color="#c3a6ff"/>
          <stop offset="100%" stop-color="#9fe3ff"/>
        </linearGradient>
        <linearGradient id="shackleGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f1e6ff"/>
          <stop offset="100%" stop-color="#b79bff"/>
        </linearGradient>
      </defs>
      <path class="shackle" d="M30 58 V40 a25 25 0 0 1 50 0 V58"
            fill="none" stroke="url(#shackleGrad)" stroke-width="11" stroke-linecap="round"/>
      <rect x="12" y="54" width="86" height="68" rx="18" fill="url(#lockGrad)"/>
      <rect x="12" y="54" width="86" height="68" rx="18" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
      <path class="keyhole" d="M55 74 a9 9 0 0 1 5 16.5 L62 104 h-14 l2-13.5 A9 9 0 0 1 55 74z" fill="#2a1638"/>
    </svg>

    <p class="hint">Попробуй угадать какую дату надо ввести )</p>

    <form class="input-wrap" id="lockForm" autocomplete="off">
      <input id="dateInput" type="text" inputmode="numeric" placeholder="ДД/ММ/ГГГГ" maxlength="10" aria-label="Дата">
      <button id="unlockBtn" type="submit">Открыть ♡</button>
    </form>

    <div class="error" id="error">Не-а, попробуй ещё )))</div>
  </div>
</section>

<!-- ===== 2. Частицы ===== -->
<section id="scene" class="screen hidden">
  <canvas id="canvas"></canvas>
  <div class="tap-hint" id="tapHint">нажми на экран</div>
  <div class="message" id="message">
    <div class="main">очень люблю тебя ♡</div>
    <div class="sub">и знай что я тобой очень горжусь, ты у меня большая умничка :3</div>
  </div>
</section>

<script>
(() => {
  /* ================= ЗАМОК ================= */
  const SECRET = '03082026';
  const form = document.getElementById('lockForm');
  const input = document.getElementById('dateInput');
  const card = document.getElementById('card');
  const lock = document.getElementById('lock');
  const error = document.getElementById('error');
  const lockScreen = document.getElementById('lockScreen');
  const scene = document.getElementById('scene');

  // Маска ДД/ММ/ГГГГ
  input.addEventListener('input', () => {
    const d = input.value.replace(/\D/g, '').slice(0, 8);
    let out = d.slice(0, 2);
    if (d.length > 2) out += '/' + d.slice(2, 4);
    if (d.length > 4) out += '/' + d.slice(4, 8);
    input.value = out;
    error.classList.remove('show');
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const digits = input.value.replace(/\D/g, '');
    if (digits === SECRET) {
      input.blur();
      lock.classList.add('open');
      card.classList.add('success');
      setTimeout(() => {
        lockScreen.classList.add('hidden');
        scene.classList.remove('hidden');
        startScene();
      }, 1100);
    } else {
      error.classList.add('show');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      if (navigator.vibrate) navigator.vibrate(120);
    }
  });

  /* ================= ЧАСТИЦЫ ================= */
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const tapHint = document.getElementById('tapHint');
  const message = document.getElementById('message');

  // Мягкие неоновые цвета
  const COLORS = ['#ff7eb6', '#c79bff', '#7fdbff', '#9effd8', '#ffb3d9', '#a78bfa', '#ffd6a5', '#8fb8ff'];
  const HEART_COLORS = ['#ff6b9d', '#ff8fbf', '#ffa8cc', '#f472b6', '#e58bff', '#ffb3c6', '#ff7aa8'];

  let W = 0, H = 0, DPR = 1, scale = 1, cx = 0, cy = 0;
  let particles = [];
  let state = 'idle';      // idle | heart
  let formStart = 0;
  let running = false;

  function makeSprite(hex) {
    const s = 64;
    const c = document.createElement('canvas');
    c.width = c.height = s;
    const g = c.getContext('2d');
    const r = parseInt(hex.slice(1, 3), 16), gg = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    const grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.12, `rgba(${r},${gg},${b},1)`);
    grad.addColorStop(0.35, `rgba(${r},${gg},${b},0.35)`);
    grad.addColorStop(1, `rgba(${r},${gg},${b},0)`);
    g.fillStyle = grad;
    g.fillRect(0, 0, s, s);
    return c;
  }
  const SPRITES = COLORS.map(makeSprite);
  const HEART_SPRITES = HEART_COLORS.map(makeSprite);

  // Параметрическое сердце (x: -16..16, y: -17..12)
  function heartPoint(t) {
    const s = Math.sin(t);
    return {
      x: 16 * s * s * s,
      y: 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
    };
  }

  function makeHeartTarget() {
    const t = Math.random() * Math.PI * 2;
    const p = heartPoint(t);
    let k;
    if (Math.random() < 0.82) {
      k = 1 - Math.pow(Math.random(), 2.2) * 0.2;      // плотный контур
    } else {
      k = Math.sqrt(Math.random()) * 0.78;              // редкая заливка
    }
    return { hx: p.x * k, hy: p.y * k, inner: k < 0.79 };
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    scale = Math.min(W * 0.9 / 34, H * 0.78 / 30);
    cx = W / 2;
    cy = H / 2 - 2.5 * scale;

    // Текст в центре сердца
    const isSmall = W < 500;
    message.style.left = cx + 'px';
    message.style.top = (cy + 0.6 * scale) + 'px';
    message.style.width = (isSmall ? 23 : 21) * scale + 'px';
    message.querySelector('.main').style.fontSize = Math.max(18, scale * 1.9) + 'px';
    message.querySelector('.sub').style.fontSize = Math.max(12.5, scale * 0.95) + 'px';

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }

  function createParticles() {
    const count = Math.round(Math.min(1500, Math.max(650, (W * H) / 550)));
    particles = [];
    for (let i = 0; i < count; i++) {
      const target = makeHeartTarget();
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5,
        size: (target.inner ? 0.7 : 1) * (0.7 + Math.random() * 1.3),
        ci: (Math.random() * COLORS.length) | 0,
        hi: (Math.random() * HEART_COLORS.length) | 0,
        hx: target.hx,
        hy: target.hy,
        inner: target.inner,
        delay: Math.random() * 900,
        phase: Math.random() * Math.PI * 2,
        mix: 0
      });
    }
  }

  // Двойной удар сердца
  function heartbeat(time) {
    const ph = (time % 1300) / 1300;
    const a = Math.exp(-Math.pow((ph - 0.08) / 0.045, 2));
    const b = Math.exp(-Math.pow((ph - 0.26) / 0.05, 2)) * 0.6;
    return 1 + 0.045 * (a + b);
  }

  function frame(now) {
    if (!running) return;

    // Шлейф
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = state === 'heart' ? 'rgba(0,0,0,0.32)' : 'rgba(0,0,0,0.22)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    const beat = heartbeat(now);
    const elapsed = now - formStart;

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const tw = 0.65 + 0.35 * Math.sin(now * 0.003 + p.phase);

      if (state === 'heart' && elapsed > p.delay) {
        const wob = 0.25 * scale * 0.06;
        const tx = cx + p.hx * scale * beat + Math.sin(now * 0.002 + p.phase) * wob * 4;
        const ty = cy - p.hy * scale * beat + Math.cos(now * 0.0023 + p.phase) * wob * 4;
        p.vx += (tx - p.x) * 0.014;
        p.vy += (ty - p.y) * 0.014;
        p.vx *= 0.87;
        p.vy *= 0.87;
        p.mix = Math.min(1, p.mix + 0.012);
      } else {
        // Свободный дрейф
        p.vx += Math.sin(now * 0.0005 + p.phase) * 0.004;
        p.vy += Math.cos(now * 0.0004 + p.phase) * 0.004;
        p.vx *= 0.995;
        p.vy *= 0.995;
        if (p.x < -10) p.x = W + 10; else if (p.x > W + 10) p.x = -10;
        if (p.y < -10) p.y = H + 10; else if (p.y > H + 10) p.y = -10;
      }

      p.x += p.vx;
      p.y += p.vy;

      const sz = p.size * 9 * tw;
      const alpha = (p.inner && state === 'heart' ? 0.55 : 0.9) * tw;

      if (p.mix < 1) {
        ctx.globalAlpha = alpha * (1 - p.mix);
        ctx.drawImage(SPRITES[p.ci], p.x - sz / 2, p.y - sz / 2, sz, sz);
      }
      if (p.mix > 0) {
        ctx.globalAlpha = alpha * p.mix;
        ctx.drawImage(HEART_SPRITES[p.hi], p.x - sz / 2, p.y - sz / 2, sz, sz);
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  function onTap(e) {
    e.preventDefault();
    if (state === 'idle') {
      state = 'heart';
      formStart = performance.now();
      tapHint.classList.add('gone');
      setTimeout(() => message.classList.add('show'), 2200);
      if (navigator.vibrate) navigator.vibrate([40, 80, 40]);
    } else {
      // Повторный тап — «взрыв» и сборка обратно
      const x = e.clientX ?? cx, y = e.clientY ?? cy;
      for (const p of particles) {
        const dx = p.x - x, dy = p.y - y;
        const d = Math.hypot(dx, dy) || 1;
        const f = Math.min(18, 2600 / (d + 60));
        p.vx += (dx / d) * f + (Math.random() - 0.5) * 3;
        p.vy += (dy / d) * f + (Math.random() - 0.5) * 3;
      }
    }
  }

  function startScene() {
    resize();
    createParticles();
    running = true;
    requestAnimationFrame(frame);
    scene.addEventListener('pointerdown', onTap);
    window.addEventListener('resize', resize);
  }
})();
</script>
</body>
</html>
